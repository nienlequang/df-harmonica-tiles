# CI của kho công khai (DECISIONS D-445): mỗi push lên main / pull request → job `check` trên Ubuntu, Node 24 (.nvmrc):
# npm ci → lint → typecheck → format:check → test → build. Không cần secret.
# Job `e2e` (Playwright, Chromium) CHỈ chạy khi bấm "Run workflow" (thử nghiệm): nhiều spec đo điểm ảnh / cỡ cửa sổ /
# Document PiP và mới chạy trên Windows + Microsoft Edge headless — chạy ở máy bằng `npm run test:e2e`.
# Bản web deploy từ máy bằng `npm run deploy:prod` (Vercel CLI), không qua GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          PW_CHANNEL: chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
