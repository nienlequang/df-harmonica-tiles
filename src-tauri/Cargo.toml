# Bản desktop overlay (Tauri v2) — xem docs/TAURI.md.
# CHƯA từng được build trên máy phát triển (không có Rust toolchain): cấu hình viết theo tài liệu Tauri v2.
[package]
name = "harmonica-tiles-overlay"
version = "0.0.0"
description = "Delta Force Harmonica Tiles — overlay desktop (cửa sổ trong suốt, luôn nổi, phím tắt toàn cục)"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
